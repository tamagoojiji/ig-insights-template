<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: 'Hiragino Sans', system-ui, sans-serif; margin: 0; padding: 24px; color: #222; line-height: 1.7; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .info { background: #f0f8ff; border-left: 4px solid #2575fc; padding: 12px 14px; border-radius: 4px; margin: 10px 0 14px; font-size: 13px; }
  .warn { background: #fff7e0; border-left: 4px solid #f0c000; padding: 12px 14px; border-radius: 4px; margin: 10px 0 14px; font-size: 13px; }
  textarea { width: 100%; height: 280px; font-family: 'SF Mono','Menlo',monospace; font-size: 11px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }
  button { background: #d62976; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 13px; }
  pre { white-space: pre-wrap; background: #f7f7fb; padding: 10px; border-radius: 6px; font-size: 12px; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #eee; border-top-color: #d62976; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h2>📥 VPSバックフィルJSONをインポート</h2>

<div class="info">
  ローカルで <code>scripts/vps-backfill.sh</code> を実行して生成された JSON ファイルの中身を、下のテキストエリアにペーストしてください。<br>
  クリップボードにコピー: <code>pbcopy &lt; /tmp/ig-backfill-xxx.json</code>
</div>

<div class="warn">
  ⚠️ JSON のサイズが10MBを超える場合はブラウザで貼り付けが重くなることがあります。少しずつスクロールしながら待ってください。
</div>

<textarea id="json" placeholder='{"media":[...],"count":172,"fetched_at":...}'></textarea>
<button id="run" onclick="run()">インポート実行</button>
<div id="status"></div>

<script>
function run() {
  const j = document.getElementById('json').value.trim();
  if (!j) {
    document.getElementById('status').innerHTML = '<span style="color:#b91c1c;">JSONを入力してください</span>';
    return;
  }
  const btn = document.getElementById('run');
  btn.disabled = true;
  document.getElementById('status').innerHTML = '<span class="spin"></span>処理中...（数千件あると30秒〜2分かかります）';
  google.script.run
    .withSuccessHandler(r => {
      document.getElementById('status').innerHTML = '<span style="color:#16a34a;font-weight:bold;">✅ 完了</span><pre>' + r.summary + '</pre>';
      btn.disabled = false;
    })
    .withFailureHandler(e => {
      document.getElementById('status').innerHTML = '<span style="color:#b91c1c;">❌ ' + (e && e.message ? e.message : String(e)) + '</span>';
      btn.disabled = false;
    })
    .importBackfillJson(j);
}
</script>
</body>
</html>
