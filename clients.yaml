# IG Insights クライアントレジストリ
#
# 用途: clasp push のターゲット切替・状態管理・一斉展開
# 使い方:
#   ./scripts/push-to.sh <id>      # 単一クライアントへ push
#   ./scripts/push-all.sh          # 全 active クライアントへ一斉 push
#   ./scripts/status.sh            # 全クライアントの状態一覧
#   ./scripts/add-client.sh        # 新規追加（対話形式）
#
# status 値:
#   active     - 通常運用中（一斉 push の対象）
#   suspended  - 一時停止（アカウント停止・運用休止など。push対象から除外）
#   archived   - 完全終了（参照のみ）

